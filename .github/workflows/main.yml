name: Build BANGLA TUR BD Moderator APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-apk:
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout Project
        uses: actions/checkout@v4

      # -----------------------------
      # Node.js
      # -----------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # -----------------------------
      # Java
      # -----------------------------
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # -----------------------------
      # Android SDK
      # IMPORTANT:
      # Do NOT use setup-android action.
      # It was trying to install obsolete "tools".
      # -----------------------------
      - name: Prepare Android SDK
        shell: bash
        run: |
          set -e

          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT=/usr/local/lib/android/sdk

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          echo "Accepting Android SDK licenses..."
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

          echo "Installing required Android SDK packages..."

          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      # -----------------------------
      # Install npm dependencies
      # -----------------------------
      - name: Install Node Dependencies
        run: |
          npm install

      # -----------------------------
      # Build Web App
      # -----------------------------
      - name: Build Web App
        run: |
          npm run build

      # -----------------------------
      # Capacitor Android Sync
      # -----------------------------
      - name: Sync Capacitor Android
        run: |
          npx cap sync android

      # -----------------------------
      # Gradle permission
      # -----------------------------
      - name: Make Gradle Executable
        working-directory: android
        run: |
          chmod +x gradlew

      # -----------------------------
      # Build APK
      # -----------------------------
      - name: Build Debug APK
        working-directory: android
        run: |
          ./gradlew assembleDebug --no-daemon --stacktrace

      # -----------------------------
      # Upload APK
      # -----------------------------
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BANGLA-TUR-BD-Moderator-APK
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
