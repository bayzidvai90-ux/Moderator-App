name: Build BANGLA TUR BD Moderator APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-apk:
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:

      # ==============================
      # 1. Checkout
      # ==============================
      - name: Checkout Project
        uses: actions/checkout@v4

      # ==============================
      # 2. Node.js 22
      # ==============================
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Verify Node
        run: |
          node -v
          npm -v

      # ==============================
      # 3. Java 17
      # ==============================
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify Java
        run: |
          java -version
          echo "JAVA_HOME=$JAVA_HOME"

      # ==============================
      # 4. Android SDK
      # ==============================
      - name: Prepare Android SDK
        shell: bash
        run: |
          set -e

          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            --licenses > /dev/null || true

          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      # ==============================
      # 5. Fix Vite / esbuild
      # ==============================
      - name: Fix Vite Dependencies
        shell: bash
        run: |
          set -e

          npm install -D \
            vite@^8.3.0 \
            esbuild@^0.28.2 \
            @vitejs/plugin-react@^6.1.1 \
            --legacy-peer-deps

      # ==============================
      # 6. Install Dependencies
      # ==============================
      - name: Install All Dependencies
        shell: bash
        run: |
          set -e
          npm install --legacy-peer-deps

      # ==============================
      # 7. Verify Dependencies
      # ==============================
      - name: Verify Dependencies
        shell: bash
        run: |
          npm ls vite esbuild @vitejs/plugin-react --depth=0 || true

      # ==============================
      # 8. Build Web App
      # ==============================
      - name: Build Web App
        shell: bash
        run: |
          set -e
          npm run build

      # ==============================
      # 9. Capacitor Sync
      # ==============================
      - name: Sync Capacitor Android
        shell: bash
        run: |
          set -e

          node -v
          npx cap sync android

      # ==============================
      # 10. ENABLE ANDROIDX
      # ==============================
      - name: Enable AndroidX
        shell: bash
        run: |
          set -e

          touch android/gradle.properties

          if grep -q "^android.useAndroidX=" android/gradle.properties; then
            sed -i \
              's/^android.useAndroidX=.*/android.useAndroidX=true/' \
              android/gradle.properties
          else
            echo "android.useAndroidX=true" \
              >> android/gradle.properties
          fi

          if grep -q "^android.enableJetifier=" android/gradle.properties; then
            sed -i \
              's/^android.enableJetifier=.*/android.enableJetifier=true/' \
              android/gradle.properties
          else
            echo "android.enableJetifier=true" \
              >> android/gradle.properties
          fi

          echo ""
          echo "================================"
          echo "ANDROIDX CONFIGURATION"
          echo "================================"

          cat android/gradle.properties

      # ==============================
      # 11. Check Android Project
      # ==============================
      - name: Check Android Project
        working-directory: android
        shell: bash
        run: |
          set -e

          chmod +x gradlew

          ./gradlew --version

          echo ""
          echo "================================"
          echo "ANDROID PROJECT"
          echo "================================"

          ls -la

      # ==============================
      # 12. Build APK
      # ==============================
      - name: Build Debug APK
        working-directory: android
        shell: bash
        run: |
          set +e

          chmod +x gradlew

          ./gradlew assembleDebug \
            --no-daemon \
            --stacktrace \
            --info \
            --console=plain \
            2>&1 | tee ../gradle-build.log

          EXIT_CODE=${PIPESTATUS[0]}

          echo ""
          echo "================================"
          echo "GRADLE EXIT CODE: $EXIT_CODE"
          echo "================================"

          echo ""
          echo "========== ERROR SUMMARY =========="

          grep -n -E \
            "What went wrong|Execution failed|FAILURE|Could not|error:|ERROR|Caused by:" \
            ../gradle-build.log \
            | tail -n 120 || true

          echo ""
          echo "========== LAST LOG LINES =========="

          tail -n 150 ../gradle-build.log

          exit $EXIT_CODE

      # ==============================
      # 13. Check APK
      # ==============================
      - name: Check APK
        if: success()
        shell: bash
        run: |
          echo "================================"
          echo "APK FILES"
          echo "================================"

          find android/app/build/outputs/apk \
            -type f \
            -name "*.apk" \
            -print

      # ==============================
      # 14. Upload APK
      # ==============================
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: BANGLA-TUR-BD-Moderator-APK
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
