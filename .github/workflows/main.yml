name: Build BANGLA TUR BD Moderator APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-apk:
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:

      # 1. Checkout
      - name: Checkout Project
        uses: actions/checkout@v6

      # 2. Node.js
      - name: Setup Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Verify Node
        run: |
          node -v
          npm -v

      # 3. Java 17
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify Java
        run: |
          java -version
          echo "JAVA_HOME=$JAVA_HOME"

      # 4. Android SDK
      - name: Prepare Android SDK
        shell: bash
        run: |
          set -e

          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            --licenses > /dev/null || true

          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      # 5. Install dependencies
      - name: Install Dependencies
        shell: bash
        run: |
          set -e
          npm install --legacy-peer-deps

      # 6. Verify package versions
      - name: Verify Project
        shell: bash
        run: |
          echo "===== package.json ====="
          cat package.json

          echo ""
          echo "===== Node ====="
          node -v

          echo ""
          echo "===== NPM ====="
          npm -v

      # 7. Build web application
      - name: Build Web App
        shell: bash
        run: |
          set -e
          npm run build

      # 8. Capacitor sync
      - name: Sync Capacitor Android
        shell: bash
        run: |
          set -e
          npx cap sync android

      # 9. Fix Missing AndroidX Properties
      - name: Fix Missing AndroidX Properties
        shell: bash
        run: |
          set -e

          touch android/gradle.properties

          if ! grep -q "^android.useAndroidX=" android/gradle.properties; then
            echo "android.useAndroidX=true" >> android/gradle.properties
          else
            sed -i \
              's/^android.useAndroidX=.*/android.useAndroidX=true/' \
              android/gradle.properties
          fi

          if ! grep -q "^android.enableJetifier=" android/gradle.properties; then
            echo "android.enableJetifier=true" >> android/gradle.properties
          else
            sed -i \
              's/^android.enableJetifier=.*/android.enableJetifier=true/' \
              android/gradle.properties
          fi

          echo ""
          echo "===== android/gradle.properties ====="
          cat android/gradle.properties

          echo ""
          echo "AndroidX properties fixed."

      # 10. Verify Android project
      - name: Check Android Project
        working-directory: android
        shell: bash
        run: |
          set -e

          chmod +x gradlew

          ./gradlew --version

          echo ""
          echo "===== Android Variables ====="

          if [ -f variables.gradle ]; then
            cat variables.gradle
          fi

          echo ""
          echo "===== Android Project ====="
          ls -la

      # 11. Build APK
      - name: Build Debug APK
        working-directory: android
        shell: bash
        run: |
          set +e

          chmod +x gradlew

          ./gradlew assembleDebug \
            --no-daemon \
            --stacktrace \
            --info \
            --console=plain \
            --warning-mode all \
            2>&1 | tee ../gradle-build.log

          EXIT_CODE=${PIPESTATUS[0]}

          echo ""
          echo "========================================"
          echo "GRADLE BUILD EXIT CODE: $EXIT_CODE"
          echo "========================================"

          echo ""
          echo "========== ACTUAL COMPILER ERROR =========="

          grep -n -B 8 -A 15 -E \
            "error:|ERROR:|FAILURE:|Execution failed|What went wrong|Caused by:" \
            ../gradle-build.log \
            | tail -n 250 || true

          echo ""
          echo "========== LAST 250 LOG LINES =========="

          tail -n 250 ../gradle-build.log

          exit $EXIT_CODE

      # 12. Find APK
      - name: Check APK
        if: success()
        shell: bash
        run: |
          echo "========================================"
          echo "APK FILES"
          echo "========================================"

          find android/app/build/outputs/apk \
            -type f \
            -name "*.apk" \
            -print

      # 13. Upload APK
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: BANGLA-TUR-BD-Moderator-APK
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # 14. Upload build log if failed
      - name: Upload Gradle Error Log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Gradle-Build-Error-Log
          path: gradle-build.log
          if-no-files-found: ignore
