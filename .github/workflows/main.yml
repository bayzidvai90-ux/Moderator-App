name: Build BANGLA TUR BD Moderator APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-apk:
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:

      - name: Checkout Project
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Verify Node
        run: |
          node -v
          npm -v

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify Java
        run: |
          java -version
          echo "JAVA_HOME=$JAVA_HOME"

      - name: Prepare Android SDK
        shell: bash
        run: |
          set -e

          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Fix Vite Dependencies
        run: |
          npm install -D \
            vite@^8.3.0 \
            esbuild@^0.28.2 \
            @vitejs/plugin-react@^6.1.1 \
            --legacy-peer-deps

      - name: Install All Dependencies
        run: |
          npm install --legacy-peer-deps

      - name: Verify Dependencies
        run: |
          npm ls vite esbuild @vitejs/plugin-react --depth=0 || true

      - name: Build Web App
        run: |
          npm run build

      - name: Sync Capacitor Android
        run: |
          node -v
          npx cap sync android

      - name: Check Android Project
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --version
          echo "----- Android project files -----"
          ls -la

      - name: Build Debug APK
        working-directory: android
        shell: bash
        run: |
          set +e

          chmod +x gradlew

          ./gradlew assembleDebug \
            --no-daemon \
            --stacktrace \
            --info \
            --console=plain \
            2>&1 | tee ../gradle-build.log

          EXIT_CODE=${PIPESTATUS[0]}

          echo ""
          echo "=============================="
          echo "GRADLE BUILD EXIT CODE: $EXIT_CODE"
          echo "=============================="

          echo ""
          echo "========== LAST 150 LOG LINES =========="
          tail -n 150 ../gradle-build.log

          echo ""
          echo "========== ERROR LINES =========="
          grep -n -E "What went wrong|Execution failed|FAILURE|Could not|error:|ERROR|Caused by:" ../gradle-build.log | tail -n 100 || true

          exit $EXIT_CODE

      - name: Check APK
        if: success()
        run: |
          echo "APK files:"
          find android/app/build/outputs/apk -type f -name "*.apk" -print

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: BANGLA-TUR-BD-Moderator-APK
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
